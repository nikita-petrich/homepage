name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

# All secrets/variables live in the GitHub environment "prod".
# The stack directory on the VPS is fixed: /opt/stacks/homepage.
#
# Every secret reaches a `run:` block through `env:`, never through a
# `${{ … }}` expression inside the script. Expressions are substituted into the
# shell source *before* the shell parses it, so a secret containing a quote or a
# `$(…)` would be executed rather than passed along. Read as `"$VAR"` the value
# stays a value. See
# https://docs.github.com/actions/security-for-github-actions/security-guides/security-hardening-for-github-actions

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # The build job needs the environment too: UMAMI_WEBSITE_ID is inlined
    # into the frontend at image build time (NEXT_PUBLIC_*).
    environment: prod
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_UMAMI_WEBSITE_ID=${{ vars.UMAMI_WEBSITE_ID }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: prod
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      STACK_DIR: /opt/stacks/homepage
    steps:
      - uses: actions/checkout@v7

      # VPS_HOST_KEY pins the server's host key. Without it the first SSH
      # connection of every run trusts whatever answers on that address
      # (ssh-keyscan is trust-on-first-use, and each runner starts empty), so a
      # DNS or routing hijack would be handed the deploy key. Leave the secret
      # unset and the workflow falls back to keyscan with a warning — set it to
      # the output of `ssh-keyscan -H <host>` run once from a trusted machine.
      - name: Set up SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          if [ -n "$VPS_HOST_KEY" ]; then
            printf '%s\n' "$VPS_HOST_KEY" > ~/.ssh/known_hosts
          else
            echo "::warning::VPS_HOST_KEY is not set — falling back to ssh-keyscan (trust on first use)."
            ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Copy compose file
        run: |
          ssh -i ~/.ssh/id_ed25519 "$VPS_USER@$VPS_HOST" "mkdir -p '$STACK_DIR'"
          scp -i ~/.ssh/id_ed25519 deploy/docker-compose.yml \
            "$VPS_USER@$VPS_HOST:$STACK_DIR/docker-compose.yml"

      # The compose .env is rendered from GitHub Secrets on every deploy —
      # nothing secret is maintained by hand on the server. It is written with a
      # 600 umask and piped over the existing SSH connection rather than staged
      # as a file on the runner, so the values never touch the runner's disk.
      - name: Write server .env from secrets
        env:
          UMAMI_DB_PASSWORD: ${{ secrets.UMAMI_DB_PASSWORD }}
          UMAMI_APP_SECRET: ${{ secrets.UMAMI_APP_SECRET }}
        run: |
          printf 'UMAMI_DB_PASSWORD=%s\nUMAMI_APP_SECRET=%s\n' \
            "$UMAMI_DB_PASSWORD" "$UMAMI_APP_SECRET" \
            | ssh -i ~/.ssh/id_ed25519 "$VPS_USER@$VPS_HOST" \
                "umask 077 && cat > '$STACK_DIR/.env'"

      # The GHCR package is PUBLIC, so the VPS pulls the image anonymously and
      # must never stay logged in to ghcr.io. `docker logout` first clears any
      # stale login token left in the VPS's shared Docker credential store
      # (e.g. by another stack's deploy): an *expired* token makes the registry
      # answer "denied" even for a public image, whereas no token pulls fine.
      # `|| true` keeps the step green when nothing was logged in.
      - name: Pull and restart services
        run: |
          ssh -i ~/.ssh/id_ed25519 "$VPS_USER@$VPS_HOST" \
            "docker logout ghcr.io || true && cd '$STACK_DIR' && docker compose pull && docker compose up -d --remove-orphans && docker image prune -f"
