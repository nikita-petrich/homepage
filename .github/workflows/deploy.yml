name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

# All secrets/variables live in the GitHub environment "prod".
# The stack directory on the VPS is fixed: /opt/stacks/homepage.

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # The build job needs the environment too: UMAMI_WEBSITE_ID is inlined
    # into the frontend at image build time (NEXT_PUBLIC_*).
    environment: prod
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_UMAMI_WEBSITE_ID=${{ vars.UMAMI_WEBSITE_ID }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v7

      - name: Set up SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Copy compose file
        run: |
          ssh -i ~/.ssh/id_ed25519 "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "mkdir -p /opt/stacks/homepage"
          scp -i ~/.ssh/id_ed25519 deploy/docker-compose.yml \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/stacks/homepage/docker-compose.yml"

      # The compose .env is rendered from GitHub Secrets on every deploy —
      # nothing secret is maintained by hand on the server.
      - name: Write server .env from secrets
        run: |
          printf 'UMAMI_DB_PASSWORD=%s\nUMAMI_APP_SECRET=%s\n' \
            '${{ secrets.UMAMI_DB_PASSWORD }}' \
            '${{ secrets.UMAMI_APP_SECRET }}' > server.env
          scp -i ~/.ssh/id_ed25519 server.env \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/stacks/homepage/.env"
          ssh -i ~/.ssh/id_ed25519 "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "chmod 600 /opt/stacks/homepage/.env"
          rm server.env

      - name: Pull and restart services
        run: |
          ssh -i ~/.ssh/id_ed25519 "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "cd /opt/stacks/homepage && docker compose pull && docker compose up -d --remove-orphans && docker image prune -f"
