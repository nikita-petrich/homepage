name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only. `pull_request` runs from forks with a read-only token anyway, but
# an in-repo branch would otherwise inherit whatever the repository default is —
# and nothing in this workflow writes.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm build

      - name: Audit production dependencies
        run: pnpm audit --prod
