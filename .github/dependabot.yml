version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    open-pull-requests-limit: 5
    ignore:
      # @types/node tracks the Node runtime (node:22-alpine in the Dockerfile,
      # node-version: 22 in CI). A major bump here would describe APIs the
      # runtime does not have, and typecheck would not catch it. Move this
      # deliberately when the runtime moves.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

  # The Dockerfile's base image is a floating tag (node:22-alpine), so a
  # rebuild already picks up patched Alpine and Node releases. This entry is
  # what surfaces the *major* Node bump as a pull request instead of leaving
  # the runtime to drift silently past the version @types/node is pinned to.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
