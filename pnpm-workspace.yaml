allowBuilds:
  '@parcel/watcher': true
  '@tailwindcss/oxide': true
  esbuild: true
  sharp: true
  unrs-resolver: true

# Security floors for vulnerable transitive dependencies pinned by next
# (postcss: GHSA-6g55-p6wh-862q; sharp: GHSA-f88m-g3jw-g9cj).
# Known remaining advisory: brace-expansion <=5.0.7 (GHSA-mh99-v99m-4gvg,
# ReDoS) via eslint's minimatch — dev-tooling only, never shipped to the
# browser or server runtime. Forcing v5 breaks eslint, so it is accepted
# until eslint updates its own dependency tree.
overrides:
  postcss: '>=8.5.12'
  sharp: '>=0.35.0'
