<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 30" width="60" height="30" role="img" aria-label="Flagge des Vereinigten Königreichs">
  <!-- Union Jack, 2:1. Built from two stroked crosses drawn over the blue
       field: the wide white pass is the fimbriation, the narrow pass on top
       is the red saltire/cross. -->
  <clipPath id="gb-saltire">
    <!-- Counterchanges the saltire: only the trailing half of each diagonal
         arm keeps its red stroke, as on the real flag. -->
    <path d="M30,15 h30 v15 z v15 h-30 z h-30 v-15 z v-15 h30 z"/>
  </clipPath>
  <path d="M0,0 v30 h60 v-30 z" fill="#012169"/>
  <path d="M0,0 L60,30 M60,0 L0,30" stroke="#FFFFFF" stroke-width="6"/>
  <path d="M0,0 L60,30 M60,0 L0,30" clip-path="url(#gb-saltire)" stroke="#C8102E" stroke-width="4"/>
  <path d="M30,0 v30 M0,15 h60" stroke="#FFFFFF" stroke-width="10"/>
  <path d="M30,0 v30 M0,15 h60" stroke="#C8102E" stroke-width="6"/>
</svg>
