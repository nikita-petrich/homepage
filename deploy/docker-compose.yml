name: homepage

# Joins the existing external "edge" network that the reverse proxy
# (nikita-petrich/reverse-proxy, valian/docker-nginx-auto-ssl) runs on, so it
# can resolve these containers by name.
#
# Matching entries in the proxy's SITES variable:
#   sequenz.io=homepage:3000; www.sequenz.io=homepage:3000
#   stats.sequenz.io=umami:3000     (dashboard)
#
# Only the Umami *dashboard* is published this way. The collect endpoint is
# never called from the browser — the website forwards measurements
# first-party via /api/a → http://umami:3000 on the internal network.

services:
  homepage:
    image: ghcr.io/nikita-petrich/homepage:latest
    container_name: homepage
    restart: unless-stopped
    environment:
      UMAMI_ORIGIN: http://umami:3000
    depends_on:
      - umami
    networks:
      - edge
      - internal

  umami:
    # Pinned by digest on purpose: a floating tag lets a website deploy pull a
    # new Umami version as a side effect (open dashboard tabs then fail with
    # "Failed to find Server Action" until reloaded).
    #
    # A digest rather than a version tag because Umami published no numbered
    # tag for this build — postgresql-3.0.0 is seven months older, so it would
    # be a downgrade. Read the digest off the running container to move it:
    #   docker image inspect --format '{{index .RepoDigests 0}}' \
    #     "$(docker inspect --format '{{.Image}}' umami)"
    image: docker.umami.is/umami-software/umami@sha256:8edfe4beaef13f9d1300619fa264ef250a3688df9cc54d24ca830ca31cb475ec
    container_name: umami
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://umami:${UMAMI_DB_PASSWORD}@umami-db:5432/umami
      DATABASE_TYPE: postgresql
      APP_SECRET: ${UMAMI_APP_SECRET}
    depends_on:
      umami-db:
        condition: service_healthy
    networks:
      - edge
      - internal

  umami-db:
    image: postgres:16-alpine
    container_name: umami-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: umami
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: ${UMAMI_DB_PASSWORD}
    volumes:
      - umami-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umami -d umami"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

networks:
  edge:
    external: true
  internal:

volumes:
  umami-db:
